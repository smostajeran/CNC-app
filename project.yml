name: Quill
options:
  bundleIdPrefix: com.cncapp
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
packages:
  CNCCore:
    path: CNCCore
targets:
  Quill:
    type: application
    platform: macOS
    sources:
      - path: Quill
        excludes:
          - "*.entitlements"
          - Info.plist
    info:
      path: Quill/Info.plist
      properties:
        CFBundleDisplayName: Quill
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleIconName: AppIcon
    dependencies:
      - package: CNCCore
        product: CNCCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cncapp.Quill
        PRODUCT_NAME: Quill
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Quill/Quill.entitlements
        # Local Debug builds use ad-hoc signing; hardened runtime breaks that.
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: NO
