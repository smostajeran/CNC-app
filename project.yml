name: Quill
options:
  bundleIdPrefix: com.cncapp
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
packages:
  CNCCore:
    path: CNCCore
targets:
  Quill:
    type: application
    platform: macOS
    sources:
      - path: Quill
        excludes:
          - "*.entitlements"
    dependencies:
      - package: CNCCore
        product: CNCCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cncapp.Quill
        PRODUCT_NAME: Quill
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Quill
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Quill/Quill.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
