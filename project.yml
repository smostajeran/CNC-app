name: TA4Host
options:
  bundleIdPrefix: com.cncapp
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
packages:
  CNCCore:
    path: CNCCore
targets:
  TA4Host:
    type: application
    platform: macOS
    sources:
      - path: TA4Host
        excludes:
          - "*.entitlements"
          - Info.plist
    info:
      path: TA4Host/Info.plist
      properties:
        CFBundleDisplayName: TA4Host
        LSApplicationCategoryType: public.app-category.utilities
    dependencies:
      - package: CNCCore
        product: CNCCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cncapp.TA4Host
        PRODUCT_NAME: TA4Host
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: TA4Host/TA4Host.entitlements
        # Local Debug builds use ad-hoc signing; hardened runtime breaks that.
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: NO
