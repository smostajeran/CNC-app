name: TA4Host
options:
  bundleIdPrefix: com.cncapp
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
packages:
  CNCCore:
    path: CNCCore
targets:
  TA4Host:
    type: application
    platform: macOS
    sources:
      - path: TA4Host
        excludes:
          - "*.entitlements"
    dependencies:
      - package: CNCCore
        product: CNCCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cncapp.TA4Host
        PRODUCT_NAME: TA4Host
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TA4Host
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        CODE_SIGN_ENTITLEMENTS: TA4Host/TA4Host.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
