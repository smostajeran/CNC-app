name: Quill
options:
  bundleIdPrefix: com.cncapp
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  # Keep generated project readable by Xcode 15+ / 16 CI images.
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
packages:
  CNCCore:
    path: CNCCore
targets:
  Quill:
    type: application
    platform: macOS
    sources:
      - path: Quill
        excludes:
          - "*.entitlements"
          - Info.plist
    info:
      path: Quill/Info.plist
      properties:
        CFBundleDisplayName: Quill
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleIconName: AppIcon
    dependencies:
      - package: CNCCore
        product: CNCCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cncapp.Quill
        PRODUCT_NAME: Quill
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "11"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Quill/Quill.entitlements
        # Local Debug builds use ad-hoc signing; hardened runtime breaks that.
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: NO
    preBuildScripts:
      - name: Fix noticeTitle nil clears
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          FILE="${SRCROOT}/Quill/AppModel.swift"
          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1])
          t = p.read_text(encoding="utf-8")
          t2, n = re.subn(r"noticeTitle\s*=\s*nil\b", 'noticeTitle = ""', t)
          if n:
              p.write_text(t2, encoding="utf-8")
              print(f"preBuild: patched {n} noticeTitle = nil → \"\"")
          left = t2 if n else t
          if re.search(r"noticeTitle\s*=\s*nil\b", left):
              raise SystemExit("preBuild: noticeTitle = nil still present in AppModel.swift")
          PY
      - name: Stamp git commit into BuildInfo
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          ROOT="${SRCROOT}"
          "${ROOT}/scripts/stamp-build-info.sh"
    postBuildScripts:
      - name: Restore BuildInfo.swift placeholder
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          git -C "${SRCROOT}" checkout -- Quill/BuildInfo.swift 2>/dev/null || true
          APP="${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}"
          PLIST="${APP}/Contents/Info.plist"
          SHA="$(git -C "${SRCROOT}" rev-parse --short HEAD 2>/dev/null || echo unknown)"
          if [[ -f "$PLIST" ]]; then
            /usr/libexec/PlistBuddy -c "Set :QuillGitCommit ${SHA}" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :QuillGitCommit string ${SHA}" "$PLIST"
          fi
